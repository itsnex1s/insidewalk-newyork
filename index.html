<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Castiron — walk Lower Manhattan</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1c1e; color: #f2efe8; font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
      #view { position: fixed; inset: 0; touch-action: none; }
      #view canvas { display: block; width: 100%; height: 100%; }
      .hud { position: fixed; left: 16px; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
      #title { top: 14px; font-weight: 600; letter-spacing: 0.02em; }
      #title span { font-weight: 400; opacity: 0.75; }
      #place { top: 36px; font-size: 18px; font-weight: 600; }
      #hint { bottom: 14px; opacity: 0.8; font-size: 13px; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 16px; background: #1b1c1e; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="title" class="hud">Castiron <span>· Lower Manhattan, New York</span></div>
    <div id="place" class="hud"></div>
    <div id="hint" class="hud">Click to look · WASD to walk · Shift to hurry · F to fly</div>
    <div id="status">Loading Lower Manhattan…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
